const cities = ["Alle", "Prijedor", "Kozarac", "Banja Luka", "Gradiška"];
const kategorien = ["Alle", "Opći izvođač", "Bazeni", "Sanitär", "Grijanje", "Elektro", "Fenster"];
let activeCity = "Alle";
let activeCategory = "Alle";
let activeSearch = "";
let onlyFav = false;

// status[placeId] = { favorite, contacted, note, emailText, files: [{name,url,path,uploadedAt}] }
const status = {};
firmen.forEach(f => { status[f.placeId] = { favorite: false, contacted: false, note: "", emailText: "", files: [] }; });

// ---------- Firestore Sync ----------
if(firebaseReady){
  db.collection('baufirmen_status').onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      const d = change.doc.data();
      status[change.doc.id] = {
        favorite: !!d.favorite,
        contacted: !!d.contacted,
        note: d.note || "",
        emailText: d.emailText || "",
        files: Array.isArray(d.files) ? d.files : []
      };
    });
    syncStatusEl.textContent = "Synchronisiert mit Firebase";
    syncStatusEl.className = "ok";
    render();
    refreshOpenPopups();
  }, err => {
    console.error("Firestore-Fehler:", err);
    syncStatusEl.textContent = "Firebase-Fehler: " + err.message;
    syncStatusEl.className = "error";
  });
}

function saveStatus(placeId, patch){
  status[placeId] = { ...status[placeId], ...patch };
  if(firebaseReady){
    db.collection('baufirmen_status').doc(placeId).set(patch, { merge: true })
      .catch(err => console.error("Speichern fehlgeschlagen:", err));
  }
}
function toggleFavorite(placeId){ saveStatus(placeId, { favorite: !status[placeId].favorite }); render(); refreshOpenPopups(); }
function toggleContacted(placeId, checked){ saveStatus(placeId, { contacted: checked }); render(); refreshOpenPopups(); }
function saveNote(placeId, value){ saveStatus(placeId, { note: value }); }
function saveEmailText(placeId, value){ saveStatus(placeId, { emailText: value }); }

function uploadFile(placeId, file){
  const MAX_BYTES = 650000; // Reserve lassen für andere Felder im 1MB-Firestore-Limit
  if(file.size > MAX_BYTES){
    setUploadMsg(placeId, "Datei zu groß (" + Math.round(file.size/1024) + " KB) – Firestore-Dokumente sind auf ca. 1 MB begrenzt. Bitte kleinere/komprimierte Datei verwenden.");
    return;
  }
  setUploadMsg(placeId, "Lade hoch: " + file.name + " …");
  const reader = new FileReader();
  reader.onload = () => {
    const newFiles = [...status[placeId].files, { name: file.name, dataUrl: reader.result, uploadedAt: Date.now(), size: file.size }];
    saveStatus(placeId, { files: newFiles });
    setUploadMsg(placeId, "");
    render();
    refreshOpenPopups();
  };
  reader.onerror = () => setUploadMsg(placeId, "Fehler beim Lesen der Datei.");
  reader.readAsDataURL(file);
}
function deleteFile(placeId, index){
  const newFiles = status[placeId].files.filter((_, i) => i !== index);
  saveStatus(placeId, { files: newFiles });
  render();
  refreshOpenPopups();
}
const uploadMsgEls = {};
function setUploadMsg(placeId, msg){
  document.querySelectorAll('[data-uploadmsg="' + placeId + '"]').forEach(el => { el.textContent = msg; });
}

// ---------- Karte ----------
const map = L.map('map').setView([44.87, 17.0], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap-Mitwirkende'
}).addTo(map);

function ratingClass(r){ if(r === null) return "none"; if(r >= 4.5) return "good"; if(r >= 4.0) return "warn"; return "bad"; }
function ratingLabel(f){ if(f.rating === null) return "Keine Bewertungen"; return "★ " + f.rating.toFixed(1) + " (" + f.count + ")"; }
function groesseBadge(f){
  const map2 = { gross: ["Grösser / etabliert", "#4C7A4E"], mittel: ["Mittlerer Betrieb", "#B5813A"], klein: ["Eher klein", "#A6473F"], unklar: ["Grösse unklar", "#6B645B"] };
  const [label, color] = map2[f.groesse] || map2.unklar;
  return `<span style="display:inline-block;font-size:11px;font-weight:700;color:${color};border:1px solid ${color};border-radius:2px;padding:1px 6px;">${label}</span>`;
}
function mapsLink(f){ return "https://www.google.com/maps/place/?q=place_id:" + f.placeId; }

function fileListHtml(f){
  const files = status[f.placeId].files || [];
  if(files.length === 0) return `<div class="upload-status" data-uploadmsg="${f.placeId}"></div>`;
  return `<div class="file-list">` + files.map((file, i) => `
    <div class="file-item">
      <a href="${file.dataUrl}" download="${file.name}" title="${file.name} (${Math.round((file.size||0)/1024)} KB) – herunterladen/öffnen">${file.name}</a>
      <button class="file-del" data-filedelete="${f.placeId}::${i}" title="Entfernen">✕</button>
    </div>`).join('') + `</div><div class="upload-status" data-uploadmsg="${f.placeId}"></div>`;
}
function docsBoxHtml(f){
  return `<div class="docs-box">
    <div class="field-label">Kontakt-Dokumentation</div>
    <label class="field-label" style="margin-top:2px;">Gesendete E-Mail (Text)</label>
    <textarea data-email="${f.placeId}" placeholder="E-Mail-Text hier einfügen…">${status[f.placeId].emailText || ""}</textarea>
    <label class="field-label" style="margin-top:2px;">Dokumente (Ausschreibung, Angebot, …)</label>
    ${fileListHtml(f)}
    <button class="file-upload-btn" data-filebtn="${f.placeId}">📎 Datei hochladen</button>
    <input type="file" data-fileinput="${f.placeId}" style="display:none">
  </div>`;
}
function controlsHtml(f){
  const s = status[f.placeId];
  return `<div class="card-controls">
    <div class="controls-row">
      <button class="fav-btn ${s.favorite ? 'active' : ''}" data-fav="${f.placeId}" title="Favorit">${s.favorite ? '★' : '☆'}</button>
      <label class="contacted-label"><input type="checkbox" data-contacted="${f.placeId}" ${s.contacted ? 'checked' : ''}> Kontaktiert</label>
    </div>
    <textarea data-note="${f.placeId}" placeholder="Notiz (z.B. Angebot erhalten, Termin vereinbart…)">${s.note || ""}</textarea>
    ${s.contacted ? docsBoxHtml(f) : ""}
  </div>`;
}
function popupHtml(f){
  const s = status[f.placeId];
  return `<div class="popup">
    <span class="tag city-tag">${f.ort}</span><span class="tag cat-tag">${f.kategorie}</span>
    <h3>${s.favorite ? '★ ' : ''}${f.name}</h3>
    <p>${f.adresse}</p>
    ${f.tel ? `<p>Tel: <a href="tel:${f.tel.replace(/\s/g,'')}">${f.tel}</a></p>` : `<p>Tel: nicht hinterlegt</p>`}
    <p class="rating ${ratingClass(f.rating)}">${ratingLabel(f)}</p>
    <p>${groesseBadge(f)}</p>
    <hr>
    <p>${f.note}</p>
    <a class="maplink" href="${mapsLink(f)}" target="_blank" rel="noopener">Auf Google Maps öffnen (Fotos, Webseite, mehr Bewertungen) →</a>
    ${controlsHtml(f)}
  </div>`;
}

const markers = {};
firmen.forEach((f, i) => { markers[i] = L.marker([f.lat, f.lng]).addTo(map).bindPopup(() => popupHtml(f)); });
function refreshOpenPopups(){
  firmen.forEach((f, i) => { const m = markers[i]; if(m.isPopupOpen()){ m.setPopupContent(popupHtml(f)); } });
}

// ---------- Globale Delegation ----------
document.addEventListener('click', (e) => {
  const favBtn = e.target.closest('[data-fav]');
  if(favBtn){ toggleFavorite(favBtn.dataset.fav); return; }
  const fileBtn = e.target.closest('[data-filebtn]');
  if(fileBtn){
    const pid = fileBtn.dataset.filebtn;
    const input = document.querySelector(`.leaflet-popup [data-fileinput="${pid}"], #list [data-fileinput="${pid}"]`);
    // Falls mehrere (Liste + Popup gleichzeitig gerendert) offen sind, das dem Klick am nächsten liegende nehmen
    const scope = fileBtn.closest('.docs-box');
    const localInput = scope ? scope.querySelector('[data-fileinput]') : input;
    (localInput || input) && (localInput || input).click();
    return;
  }
  const delBtn = e.target.closest('[data-filedelete]');
  if(delBtn){
    const [pid, idx] = delBtn.dataset.filedelete.split('::');
    deleteFile(pid, parseInt(idx, 10));
    return;
  }
});
document.addEventListener('change', (e) => {
  const cb = e.target.closest('[data-contacted]');
  if(cb){ toggleContacted(cb.dataset.contacted, cb.checked); return; }
  const fi = e.target.closest('[data-fileinput]');
  if(fi && fi.files && fi.files[0]){ uploadFile(fi.dataset.fileinput, fi.files[0]); fi.value = ""; return; }
});
document.addEventListener('focusout', (e) => {
  const ta = e.target.closest('[data-note]');
  if(ta){ saveNote(ta.dataset.note, ta.value); return; }
  const em = e.target.closest('[data-email]');
  if(em){ saveEmailText(em.dataset.email, em.value); return; }
});

// ---------- Sidebar ----------
const filtersEl = document.getElementById('filters');
cities.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'chip' + (c === activeCity ? ' active' : '');
  btn.textContent = c;
  btn.onclick = () => { activeCity = c; render(); };
  btn.dataset.city = c;
  filtersEl.appendChild(btn);
});
const favChip = document.createElement('button');
favChip.className = 'chip fav-chip';
favChip.textContent = '★ Nur Favoriten';
favChip.onclick = () => { onlyFav = !onlyFav; favChip.classList.toggle('active', onlyFav); render(); };
filtersEl.appendChild(favChip);

const catFiltersEl = document.getElementById('catFilters');
kategorien.forEach(k => {
  const btn = document.createElement('button');
  btn.className = 'chip cat-chip' + (k === activeCategory ? ' active' : '');
  btn.textContent = k;
  btn.onclick = () => { activeCategory = k; render(); };
  btn.dataset.kategorie = k;
  catFiltersEl.appendChild(btn);
});

document.getElementById('search').addEventListener('input', (e) => { activeSearch = e.target.value.toLowerCase(); render(); });

document.getElementById('list').addEventListener('click', (e) => {
  const main = e.target.closest('.card-main');
  if(!main) return;
  const idx = firmen.findIndex(f => f.placeId === main.dataset.placeid);
  if(idx === -1) return;
  const f = firmen[idx];
  map.setView([f.lat, f.lng], 13, { animate: true });
  markers[idx].openPopup();
});

function render(){
  document.querySelectorAll('.chip[data-city]').forEach(b => b.classList.toggle('active', b.dataset.city === activeCity));
  document.querySelectorAll('.chip[data-kategorie]').forEach(b => b.classList.toggle('active', b.dataset.kategorie === activeCategory));
  const list = document.getElementById('list');
  const scrollPos = list.parentElement.scrollTop;
  list.innerHTML = '';
  let shown = 0;
  firmen.forEach((f, i) => {
    const s = status[f.placeId];
    const cityMatch = activeCity === "Alle" || f.ort === activeCity;
    const catMatch = activeCategory === "Alle" || f.kategorie === activeCategory;
    const searchMatch = !activeSearch || f.name.toLowerCase().includes(activeSearch) || f.adresse.toLowerCase().includes(activeSearch);
    const favMatch = !onlyFav || s.favorite;
    const visible = cityMatch && catMatch && searchMatch && favMatch;
    markers[i].getElement() && (markers[i].getElement().style.display = visible ? '' : 'none');
    if(!visible) return;
    shown++;
    const li = document.createElement('li');
    li.className = 'card' + (s.favorite ? ' is-fav' : '') + (s.contacted ? ' is-contacted' : '');
    li.innerHTML = `
      <div class="card-main" data-placeid="${f.placeId}">
        <span class="tag city-tag">${f.ort}</span><span class="tag cat-tag">${f.kategorie}</span>
        <h3>${s.favorite ? '★ ' : ''}${f.name}</h3>
        <div class="addr">${f.adresse}</div>
        <div class="rating ${ratingClass(f.rating)}">${ratingLabel(f)}</div>
        <div style="margin-top:4px;">${groesseBadge(f)}</div>
      </div>
      ${controlsHtml(f)}
    `;
    list.appendChild(li);
  });
  document.getElementById('count').textContent = shown + " Firma" + (shown === 1 ? "" : "en") + " angezeigt";
  list.parentElement.scrollTop = scrollPos;
}
render();
</script>
</body>
</html>
